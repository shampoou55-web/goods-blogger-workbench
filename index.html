<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fdf2f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="创作者工作台" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png?v=2" />
    <title>创作者专属工作台</title>
    <style>
      /* ==========================================================
         创作者专属工作台 —— 单文件版（无框架 / 无依赖 / 无服务器）
         移动端优先 · 21:9 适配 · 480px 手机画布
         ========================================================== */

      :root {
        --pink: #d86f98;
        --pink-deep: #c3567f;
        --pink-soft: #fff0f5;
        --ink: #2b2630;
        --ink-2: #665f69;
        --ink-3: #938b95;
        --card-bg: rgba(255, 255, 255, 0.9);
        --card-border: rgba(255, 255, 255, 0.96);
        --radius-lg: 24px;
        --radius-md: 18px;
        --shadow-card: 0 8px 22px rgba(191, 136, 161, 0.10);
        --shadow-soft: 0 3px 10px rgba(191, 136, 161, 0.08);
        --nav-h: 78px;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        color: var(--ink);
        background: #f8f4f6;
        overscroll-behavior-y: none;
      }

      body.locked {
        overflow: hidden;
      }

      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }

      button {
        border: none;
        background: none;
        cursor: pointer;
        padding: 0;
      }

      input,
      textarea {
        outline: none;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      svg {
        display: block;
        flex: 0 0 auto;
      }

      /* ---------- 手机画布 ---------- */

      .app-shell {
        position: relative;
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        min-height: 100dvh;
        background:
          radial-gradient(120% 55% at 8% -6%, rgba(255, 224, 237, 0.86) 0%, rgba(255, 239, 246, 0) 58%),
          radial-gradient(110% 50% at 100% 4%, rgba(255, 244, 248, 0.92) 0%, rgba(255, 250, 252, 0) 62%),
          radial-gradient(120% 60% at 50% 108%, rgba(255, 233, 241, 0.8) 0%, rgba(255, 248, 251, 0) 58%),
          linear-gradient(170deg, #fff9fb 0%, #fff5f8 44%, #ffffff 100%);
        background-attachment: fixed;
        overflow-x: hidden;
      }

      .app-shell[data-tone='finance'] {
        background:
          radial-gradient(120% 52% at 8% -8%, rgba(255, 223, 236, 0.78) 0%, rgba(255, 245, 249, 0) 60%),
          radial-gradient(110% 48% at 100% 2%, rgba(255, 246, 249, 0.94) 0%, rgba(255, 251, 253, 0) 62%),
          linear-gradient(170deg, #fff9fb 0%, #fff7f9 42%, #ffffff 100%);
      }

      .app-main {
        padding: 0 16px;
        padding-top: env(safe-area-inset-top);
        padding-bottom: calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));
      }

      /* ---------- 通用 ---------- */

      .page-head,
      .sched-head-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 0 14px;
      }

      .page-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 23px;
        font-weight: 800;
        letter-spacing: 0.4px;
        line-height: 1.15;
      }

      .page-title::before {
        content: '';
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--pink);
        flex: 0 0 auto;
        box-shadow: 0 0 0 4px rgba(244, 89, 139, 0.14);
      }

      .page-sub {
        margin-top: 2px;
        padding-left: 17px;
        font-size: 13px;
        color: var(--ink-3);
      }

      .head-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 40px;
        padding: 0 16px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 700;
        transition: transform 0.14s ease, background 0.14s ease;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn-primary {
        background: linear-gradient(135deg, #df82a5 0%, #ce5f89 100%);
        color: #fff;
        box-shadow: 0 8px 18px rgba(206, 95, 137, 0.24);
      }

      .btn-block {
        width: 100%;
        height: 50px;
        border-radius: 18px;
        font-size: 16px;
      }

      .btn-danger {
        background: #fdecec;
        color: #d9423c;
        border: 1px solid rgba(217, 66, 60, 0.18);
      }

      .btn-danger[data-armed='true'] {
        background: #e0463f;
        color: #fff;
      }

      .btn-today {
        height: 38px;
        padding: 0 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--pink-deep);
        font-weight: 800;
        font-size: 14px;
        border: 1px solid rgba(244, 89, 139, 0.18);
        box-shadow: var(--shadow-soft);
        flex: 0 0 auto;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 12px;
        color: var(--ink-2);
        transition: background 0.15s ease, transform 0.15s ease, color 0.15s ease;
      }

      .icon-btn:active {
        transform: scale(0.94);
        background: rgba(244, 89, 139, 0.08);
      }

      .icon-btn.armed {
        color: #fff;
        background: #e0463f;
      }

      .icon-btn[data-icon-danger='true'] {
        color: #e0463f;
      }

      /* ---------- 标签 ---------- */

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        max-width: 100%;
        padding: 3px 8px;
        border-radius: 9px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.35;
        white-space: nowrap;
        background: var(--tag-bg, var(--pink-soft));
        color: var(--tag-text, var(--pink-deep));
      }

      .chip-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--tag-dot, var(--pink));
        flex: 0 0 auto;
      }

      .chip-plain {
        background: rgba(255, 255, 255, 0.85);
        color: var(--ink-2);
      }

      /* ---------- 分段选择 ---------- */

      .seg {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .seg-wrap {
        flex-wrap: wrap;
      }

      .seg-wrap .seg-pill {
        flex: 1 1 30%;
        min-width: 72px;
      }

      .seg-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        padding: 0 12px;
        border-radius: 13px;
        font-size: 14px;
        font-weight: 700;
        color: var(--ink-2);
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow-soft);
        flex: 1 1 0;
        min-width: 0;
        white-space: nowrap;
        transition: background 0.16s ease, color 0.16s ease;
      }

      .seg-pill[data-active='true'] {
        color: #fff;
        background: var(--pill-color, var(--pink));
        border-color: transparent;
        box-shadow: 0 6px 14px var(--pill-shadow, rgba(244, 89, 139, 0.3));
      }

      .seg-mini {
        display: inline-flex;
        padding: 4px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: var(--shadow-soft);
        gap: 2px;
      }

      .seg-mini button {
        height: 30px;
        padding: 0 12px;
        border-radius: 11px;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-3);
        white-space: nowrap;
        transition: background 0.16s ease, color 0.16s ease;
      }

      .seg-mini button[data-active='true'] {
        background: #f5dbe5;
        color: #b04e73;
      }

      /* ---------- 表单 ---------- */

      .field {
        margin-bottom: 16px;
      }

      .field-label {
        display: block;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--ink-2);
        margin-bottom: 8px;
      }

      .input,
      .textarea {
        width: 100%;
        padding: 13px 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(244, 89, 139, 0.16);
        font-size: 15px;
        color: var(--ink);
        box-shadow: inset 0 1px 2px rgba(206, 140, 172, 0.06);
        transition: border-color 0.16s ease, box-shadow 0.16s ease;
      }

      .input::placeholder,
      .textarea::placeholder {
        color: #bdb6c6;
      }

      .input:focus,
      .textarea:focus {
        border-color: rgba(244, 89, 139, 0.55);
        box-shadow: 0 0 0 3px rgba(244, 89, 139, 0.12);
      }

      .textarea {
        min-height: 92px;
        resize: vertical;
        line-height: 1.5;
      }

      .date-row {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .date-field {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(244, 89, 139, 0.16);
        box-shadow: inset 0 1px 2px rgba(206, 140, 172, 0.06);
        overflow: hidden;
      }

      .date-field-text {
        font-size: 15.5px;
        font-weight: 800;
        letter-spacing: 0.3px;
        pointer-events: none;
      }

      .date-field-input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
        opacity: 0;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
      }

      .date-field-icon {
        position: absolute;
        right: 6px;
        z-index: 2;
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--pink);
        background: var(--pink-soft);
      }

      .form-error {
        display: none;
        color: #d9423c;
        font-size: 13px;
        font-weight: 700;
        padding: 0 0 10px;
      }

      .form-error[data-show='true'] {
        display: block;
      }

      /* ---------- Bottom Sheet ---------- */

      .sheet-overlay {
        position: fixed;
        inset: 0;
        z-index: 120;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: rgba(58, 34, 52, 0.3);
        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
        animation: fade-in 0.2s ease both;
      }

      .sheet-overlay[data-state='closing'] {
        animation: fade-out 0.2s ease both;
      }

      /* 表单内部切换选项时会重新渲染内容，但不应重新播放底部弹窗动画。 */
      .sheet-overlay[data-static='true'],
      .sheet-overlay[data-static='true'] .sheet-panel {
        animation: none !important;
        transform: none !important;
      }

      .sheet-overlay[data-state='closing'] .sheet-panel {
        animation: sheet-down 0.22s ease both;
      }

      .sheet-panel {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        max-height: 92vh;
        max-height: 92dvh;
        background: linear-gradient(180deg, #fff8fc 0%, #fffdfe 26%, #fffdfe 100%);
        border-radius: 28px 28px 0 0;
        box-shadow: 0 -12px 46px rgba(174, 104, 146, 0.28);
        animation: sheet-up 0.3s cubic-bezier(0.22, 0.9, 0.28, 1) both;
        overflow: hidden;
      }

      .sheet-head {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 22px 20px 14px;
      }

      .sheet-title {
        font-size: 21px;
        font-weight: 800;
        letter-spacing: 0.3px;
      }

      .sheet-close {
        width: 36px;
        height: 36px;
        border-radius: 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--pink);
        background: var(--pink-soft);
        flex: 0 0 auto;
      }

      .sheet-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        padding: 0 20px 6px;
      }

      .sheet-foot {
        flex: 0 0 auto;
        display: flex;
        gap: 10px;
        padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
        background: linear-gradient(180deg, rgba(255, 253, 254, 0) 0%, #fffdfe 38%);
      }

      .sheet-foot .btn-block {
        flex: 1 1 auto;
      }

      .sheet-foot .btn-danger {
        flex: 0 0 auto;
        padding: 0 18px;
      }

      @keyframes sheet-up {
        from {
          transform: translateY(102%);
        }
        to {
          transform: translateY(0);
        }
      }

      @keyframes sheet-down {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(102%);
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* ---------- 底部导航 ---------- */

      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 480px;
        height: calc(var(--nav-h) + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
        display: flex;
        align-items: stretch;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-top: 1px solid rgba(226, 190, 210, 0.5);
        box-shadow: 0 -6px 22px rgba(180, 120, 155, 0.14);
        z-index: 60;
      }

      .nav-item {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        color: #b3adbe;
        font-size: 13px;
        font-weight: 700;
        position: relative;
        transition: color 0.16s ease;
      }

      .nav-item[data-active='true'] {
        color: var(--pink);
      }

      .nav-item[data-active='true']::after {
        content: '';
        position: absolute;
        top: 6px;
        width: 34px;
        height: 3px;
        border-radius: 3px;
        background: var(--pink);
      }

      /* ---------- 空状态 / 提示 / FAB ---------- */

      .empty-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 46px 22px;
        gap: 14px;
      }

      .empty-icon {
        width: 74px;
        height: 74px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--pink);
        background: linear-gradient(150deg, #fff 0%, #ffeef6 100%);
        border: 1px solid rgba(244, 89, 139, 0.16);
        box-shadow: 0 8px 20px rgba(244, 89, 139, 0.13);
      }

      .empty-title {
        font-size: 18px;
        font-weight: 800;
        color: #6c6478;
      }

      .empty-desc {
        font-size: 13.5px;
        color: var(--ink-3);
        line-height: 1.6;
      }

      .hint {
        font-size: 12.5px;
        color: var(--ink-3);
        line-height: 1.7;
      }

      .fab {
        position: fixed;
        right: max(18px, calc(50% - 240px + 18px));
        bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));
        width: 58px;
        height: 58px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background: linear-gradient(135deg, #df82a5 0%, #ce5f89 100%);
        box-shadow: 0 10px 26px rgba(206, 95, 137, 0.28);
        z-index: 50;
        transition: transform 0.16s ease;
      }

      .fab:active {
        transform: scale(0.93);
      }

      /* ==================== 排期页 ==================== */

      .month-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 0 9px;
      }

      .month-nav h2 {
        font-size: 21px;
        font-weight: 800;
        letter-spacing: 0.4px;
      }

      .month-arrows {
        display: flex;
        gap: 8px;
      }

      .month-arrows button {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--pink-deep);
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow-soft);
      }

      .month-arrows button:active {
        transform: scale(0.94);
      }

      .calendar-weekdays {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 5px;
        padding: 0 0 8px;
      }

      .calendar-weekdays span {
        text-align: center;
        font-size: 12.5px;
        font-weight: 700;
        color: #a9a2b4;
      }

      .calendar-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
        container-type: inline-size;
      }

      .calendar-week {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 5px;
      }

      .calendar-cell {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        min-height: 21cqw;
        padding: 6px 3px 7px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 2px 6px rgba(206, 140, 172, 0.08);
        overflow: hidden;
        transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
      }

      .calendar-cell:active {
        transform: scale(0.96);
      }

      .calendar-cell-empty {
        background: rgba(255, 255, 255, 0.4);
        border-color: rgba(255, 255, 255, 0.6);
        box-shadow: none;
        cursor: default;
      }

      .calendar-cell[data-has-items='true'] {
        background: rgba(255, 255, 255, 0.86);
      }

      .calendar-cell[data-selected='true'] {
        border-color: var(--pink);
        box-shadow: 0 0 0 2px rgba(244, 89, 139, 0.18);
      }

      .calendar-cell[data-today='true'] {
        border-color: var(--pink);
        border-width: 1.5px;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(244, 89, 139, 0.14);
      }

      .calendar-daynum {
        font-size: 3.6cqw;
        font-weight: 800;
        line-height: 1.15;
        color: #4b4455;
        padding: 0 4px;
        border-radius: 6px;
      }

      .calendar-cell[data-today='true'] .calendar-daynum {
        background: var(--pink);
        color: #fff;
      }

      .calendar-tags {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        width: 100%;
        overflow: hidden;
        margin-top: auto;
      }

      .calendar-tag {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        overflow: hidden;
      }

      .calendar-tag-chip {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        max-width: 100%;
        padding: 1px 3px;
        border-radius: 5px;
        font-size: 2.05cqw;
        font-weight: 700;
        line-height: 1.35;
        white-space: nowrap;
        background: var(--tag-bg);
        color: var(--tag-text);
      }

      .calendar-tag-dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--tag-dot);
        flex: 0 0 auto;
      }

      .calendar-tag-title {
        max-width: 100%;
        font-size: 2.6cqw;
        font-weight: 700;
        line-height: 1.22;
        color: #e0477f;
        word-break: break-all;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-align: center;
      }

      .calendar-more {
        font-size: 2.4cqw;
        font-weight: 700;
        color: var(--ink-3);
      }

      .calendar-legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 14px 2px 4px;
        font-size: 11.5px;
        color: var(--ink-3);
      }

      .legend-group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .legend-title {
        color: #8b8496;
        font-weight: 700;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 3px;

    <script>
      /* ==========================================================
         创作者专属工作台 —— 纯原生 JS（无框架 / 无依赖 / 无服务器）
         ========================================================== */
      (function () {
        'use strict';

        /* ---------------- 当前日期 ---------------- */
        // 自动跟随手机/浏览器本机日期。
        const DEMO_TODAY = null;

        /* ---------------- 配色（类型 / 状态 / 形式 / 选题 / 收支） ---------------- */
        const META = {
          type: {

            日常: { dot: '#2fa87a', bg: '#ddf5ea', text: '#218a63', shadow: 'rgba(47,168,122,.32)' }
          },
          note: {

          },
          finance: {

            expense: { dot: '#9b7180', bg: '#f4edf0', text: '#7e5b69', shadow: 'rgba(155,113,128,.18)' }
          }
        };

        const TYPES = ['广告', '日常'];
        const NOTES = ['报备', '水下', '无'];
        const FORMATS = ['单推', '合集', '伪合集'];
        const TOPIC_STATUSES = ['灵感', '写作中', '待发布', '已发布'];
        const TOPIC_PLATFORMS = ['小红书', '抖音', '视频号', 'B站', '公众号', '知乎', '微博', '其他'];
        const FIN_CATEGORIES = {
          income: ['出售', '稿费'],

        };
        const FIN_LABEL = { income: '收入', expense: '支出' };

        /* ---------------- 内联图标 ---------------- */
        const ICONS = {
          calendar:
            '<rect x="3" y="4.5" width="18" height="17" rx="3.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/><path d="M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 17h.01M12 17h.01"/>',
          file: '<path d="M14 2.5H7A2.5 2.5 0 0 0 4.5 5v14A2.5 2.5 0 0 0 7 21.5h10a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 2.5V8h5.5"/><path d="M8.5 13h7M8.5 17h4.5"/>',
          wallet:
            '<path d="M20.5 9.5V7A2.5 2.5 0 0 0 18 4.5H6A2.5 2.5 0 0 0 3.5 7v10A2.5 2.5 0 0 0 6 19.5h12a2.5 2.5 0 0 0 2.5-2.5v-2.5"/><path d="M3.5 9.5h17"/><circle cx="17.5" cy="14.5" r="1.3"/>',
          plus: '<path d="M12 5v14M5 12h14"/>',
          x: '<path d="M6 6l12 12M18 6L6 18"/>',
          pencil: '<path d="M12 20h9"/><path d="M16.6 3.4a2.1 2.1 0 0 1 3 3L7.5 18.5 3.5 19.5l1-4z"/>',
          trash: '<path d="M3.5 6.5h17M9 6.5V4.2h6v2.3M6 6.5l1 14h10l1-14"/>',
          chevronLeft: '<path d="M15 5l-7 7 7 7"/>',
          chevronRight: '<path d="M9 5l7 7-7 7"/>',
          trendUp: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
          trendDown: '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',
          walletMini: '<rect x="3" y="6" width="18" height="13" rx="3.5"/><path d="M16.5 12.5h.01"/>',
          inbox: '<path d="M4 13h4l1.5 3h5L16 13h4"/><path d="M4 13V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5V13v4.5A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5z"/>'
        };

        function icon(name, size, sw) {
          return (
            '<svg viewBox="0 0 24 24" width="' + (size || 18) + '" height="' + (size || 18) +
            '" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) +
            '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            (ICONS[name] || '') + '</svg>'
          );
        }

        /* ---------------- 工具函数 ---------------- */
        const pad2 = (n) => String(n).padStart(2, '0');
        const esc = (s) =>
          String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const toISO = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
        const parseISO = (s) => {
          const p = String(s).split('-').map(Number);
          return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
        };
        const todayISO = () => DEMO_TODAY || toISO(new Date());
        const isValidISO = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
        const yearMonth = (s) => ({ year: +String(s).slice(0, 4), month: +String(s).slice(5, 7) });
        const formatDateCN = (s) => {
          const d = parseISO(s);
          return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
        };
        const formatMonthCN = (y, m) => y + '年' + m + '月';
        const formatMonthDayCN = (s) => {
          const d = parseISO(s);
          return d.getMonth() + 1 + '月' + d.getDate() + '日';
        };
        const formatDayCN = (s) => parseISO(s).getDate() + '号';
        const addMonths = (y, m, delta) => {
          const b = new Date(y, m - 1 + delta, 1);
          return { year: b.getFullYear(), month: b.getMonth() + 1 };
        };
        const uid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const nowStamp = () => new Date().toISOString();

        /* 月历矩阵（周一为第一天，前后补空位） */
        function buildMonthGrid(year, month) {
          const offset = (new Date(year, month - 1, 1).getDay() + 6) % 7;
          const days = new Date(year, month, 0).getDate();
          const cells = [];
          for (let i = 0; i < offset; i += 1) cells.push(null);
          for (let d = 1; d <= days; d += 1) cells.push({ iso: year + '-' + pad2(month) + '-' + pad2(d), day: d });
          while (cells.length % 7 !== 0) cells.push(null);
          const weeks = [];
          for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
          return weeks;
        }

        /* 金额 */
        const formatMoney = (v) => {
          const n = Number.isFinite(v) ? v : 0;
          return '¥' + (n < 0 ? '-' : '') + Math.abs(n).toFixed(2);
        };
        const formatSigned = (item) => (item.type === 'income' ? '+' : '-') + '¥' + Math.abs(item.amount).toFixed(2);

        function computeStats(items, refISO) {
          const ref = yearMonth(refISO);
          let monthIncome = 0, monthExpense = 0, totalIncome = 0, totalExpense = 0;
          items.forEach((it) => {
            const amt = Number(it.amount) || 0;
            const ym = yearMonth(it.date);
            const inMonth = ym.year === ref.year && ym.month === ref.month;
            if (it.type === 'income') {
              totalIncome += amt;
              if (inMonth) monthIncome += amt;
            } else {
              totalExpense += amt;
              if (inMonth) monthExpense += amt;
            }
          });
          return {
            monthIncome, monthExpense, monthBalance: monthIncome - monthExpense,
            totalIncome, totalExpense, totalBalance: totalIncome - totalExpense
          };
        }

        /* ---------------- localStorage ---------------- */
        const KEYS = { schedule: 'scheduleItems', topic: 'topicItems', finance: 'financeItems', tab: 'activeTab' };

        function load(key, seedFn) {
          try {
            const raw = window.localStorage.getItem(key);
            if (raw === null) {
              const v = seedFn();
              window.localStorage.setItem(key, JSON.stringify(v));
              return v;
            }
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : seedFn();
          } catch (e) {
            return seedFn();
          }
        }
        function save(key, value) {
          try {
            window.localStorage.setItem(key, JSON.stringify(value));
          } catch (e) {
            /* 隐私模式等场景静默失败 */
          }
        }

        /* ---------------- 演示数据（与截图一致） ---------------- */
        function seedSchedule() {

            ['2026-09-18', '参半', '日常', '报备', '伪合集'],
            ['2026-09-19', '喜净', '广告', '无', '单推'],

          return rows.map((r, i) => ({

            createdAt: r[0] + 'T0' + (i % 9) + ':00:00.000Z', updatedAt: '2026-09-01T00:00:00.000Z'
          }));
        }

        function seedTopics() {
          return [];
        }

        function seedFinance() {
          const rows = [
            ['income', '商单收入', '2026-09-18', '薯条 212平台扣21块2', 190],
            ['expense', '做数据', '2026-08-31', '', 400],
            ['income', '商单收入', '2026-08-09', '溜溜梅 100扣10', 90],
            ['income', '商单收入', '2026-07-15', 'poinz 100扣10', 90],

            ['expense', '投流', '2026-06-30', '薯条投放', 117],
            ['income', '商单收入', '2026-06-22', '半亩花田 100扣10', 90]
          ];
          return rows.map((r, i) => ({
            id: 'fin_seed_' + (i + 1), type: r[0], category: r[1], date: r[2], description: r[3], amount: r[4],
            createdAt: r[2] + 'T0' + (i % 9) + ':00:00.000Z', updatedAt: '2026-09-01T00:00:00.000Z'
          }));
        }

        /* ---------------- 状态 ---------------- */
        const readTab = () => {
          try {
            const t = window.localStorage.getItem(KEYS.tab);
            return t === 'topic' || t === 'finance' ? t : 'schedule';
          } catch (e) {
            return 'schedule';
          }
        };

        const state = {
          tab: readTab(),
          schedule: load(KEYS.schedule, seedSchedule),
          topics: load(KEYS.topic, seedTopics),
          finance: load(KEYS.finance, seedFinance),
          cursor: yearMonth(todayISO()),
          financeCursor: yearMonth(todayISO()),
          selectedDate: todayISO(),
          scheduleSort: 'asc',
          topicFilter: '全部',
          financeFilter: '全部',
          sheet: null
        };

        const $ = (sel) => document.querySelector(sel);
        const mainEl = () => document.getElementById('main');
        const shellEl = () => document.getElementById('shell');
        const sheetRoot = () => document.getElementById('sheet-root');

        /* 标签（彩色小胶囊） */
        function chip(meta, label, withDot) {
          return (
            '<span class="chip" style="--tag-dot:' + meta.dot + ';--tag-bg:' + meta.bg + ';--tag-text:' + meta.text + '">' +
            (withDot === false ? '' : '<i class="chip-dot"></i>') + esc(label) + '</span>'
          );
        }
        function pillStyle(meta) {
          return '--pill-color:' + meta.dot + ';--pill-shadow:' + (meta.shadow || 'rgba(244,89,139,.3)');
        }
        function segPills(field, options, value, metaOf, labelOf, wrap) {
          return (
            '<div class="seg' + (wrap ? ' seg-wrap' : '') + '" data-field="' + field + '">' +
            options.map((opt) => {
              const m = metaOf(opt);
              return (
                '<button type="button" class="seg-pill" data-act="pick" data-field="' + field +
                '" data-value="' + esc(opt) + '" data-active="' + (opt === value) + '" style="' + pillStyle(m) + '">' +
                esc(labelOf ? labelOf(opt) : opt) + '</button>'
              );
            }).join('') +
            '</div>'
          );
        }

        /* ==========================================================
           页面一：排期日历
           ========================================================== */
        function schedulePage() {
          const { year, month } = state.cursor;
          const today = todayISO();
          const prefix = year + '-' + pad2(month) + '-';
          const monthItems = state.schedule
            .filter((it) => it.date.indexOf(prefix) === 0)
            .sort((a, b) => {
              const dateCmp = String(a.date).localeCompare(String(b.date));
              if (dateCmp !== 0) return state.scheduleSort === 'desc' ? -dateCmp : dateCmp;
              const createdCmp = String(a.createdAt).localeCompare(String(b.createdAt));
              return state.scheduleSort === 'desc' ? -createdCmp : createdCmp;
            });

          const byDate = {};
          monthItems.forEach((it) => {
            (byDate[it.date] = byDate[it.date] || []).push(it);
          });

          const weeks = buildMonthGrid(year, month);

          const gridHTML = weeks
            .map(
              (week) =>
                '<div class="calendar-week">' +
                week
                  .map((cell) => {
                    if (!cell) return '<div class="calendar-cell calendar-cell-empty"></div>';
                    const items = byDate[cell.iso] || [];
                    const shown = items.slice(0, 2);
                    const rest = items.length - shown.length;
                    const cellTypes = Array.from(new Set(items.map((it) => it.type)));
                    let cellBg = '';
                    if (cellTypes.length === 1 && META.type[cellTypes[0]]) {
                      cellBg = 'background:' + META.type[cellTypes[0]].bg + ';';
                    } else if (cellTypes.includes('广告') && cellTypes.includes('日常')) {
                      cellBg = 'background:linear-gradient(135deg,' + META.type['广告'].bg + ' 0%, ' + META.type['广告'].bg + ' 50%, ' + META.type['日常'].bg + ' 50%, ' + META.type['日常'].bg + ' 100%);';
                    }
                    return (
                      '<button type="button" class="calendar-cell" data-act="new-schedule-date" data-date="' + cell.iso +
                      '" data-today="' + (cell.iso === today) + '" data-selected="' + (cell.iso === state.selectedDate) +
                      '" data-has-items="' + (items.length > 0) + '"' + (cellBg ? ' style="' + cellBg + '"' : '') + '>' +
                      '<span class="calendar-daynum">' + cell.day + '</span>' +
                      '<span class="calendar-tags">' +
                      shown
                        .map(
                          (it) =>
                            '<span class="calendar-tag">' +
                            '<span class="calendar-tag-chip" style="--tag-bg:' + META.type[it.type].bg +
                            ';--tag-text:' + META.type[it.type].text + ';--tag-dot:' + META.format[it.format].dot + '">' +
                            '<i class="calendar-tag-dot"></i>' + esc(it.format) + '</span>' +
                            '<span class="calendar-tag-title">' + esc(it.title) + '</span>' +
                            '</span>'
                        )
                        .join('') +
                      (rest > 0 ? '<span class="calendar-more">+' + rest + '</span>' : '') +
                      '</span></button>'
                    );
                  })
                  .join('') +
                '</div>'
            )
            .join('');

          const legend =
            '<div class="calendar-legend">' +
            '<span class="legend-group"><span class="legend-title">类型</span>' +
            TYPES.map((k) => '<span class="legend-item" style="--tag-dot:' + META.type[k].dot + '"><i class="legend-dot"></i>' + k + '</span>').join('') +
            '</span>' +
            '<span class="legend-group"><span class="legend-title">笔记状态</span>' +
            NOTES.map((k) => '<span class="legend-item" style="--tag-dot:' + META.note[k].dot + '"><i class="legend-dot"></i>' + k + '</span>').join('') +
            '</span>' +
            '<span class="legend-group"><span class="legend-title">形式</span>' +
            FORMATS.map((k) => '<span class="legend-item" style="--tag-dot:' + META.format[k].dot + '"><i class="legend-square"></i>' + k + '</span>').join('') +
            '</span></div>';

          const dates = Object.keys(byDate).sort((a, b) => {
            const cmp = String(a).localeCompare(String(b));
            return state.scheduleSort === 'desc' ? -cmp : cmp;
          });
          const listHTML = dates.length
            ? '<div class="sched-list">' +
              dates
                .map((date) => {
                  const items = byDate[date];
                  return (
                    '<article class="card sched-card">' +
                    '<div class="sched-card-head"><div>' +
                    '<h3 class="sched-day">' + formatDayCN(date) + '</h3>' +
                    '<p class="sched-count">' + items.length + '条排期</p>' +
                    '</div><button type="button" class="sched-manage" data-act="open-day" data-date="' + date + '">管理</button></div>' +
                    '<div class="sched-tags">' +
                    items
                      .map(
                        (it) =>
                          '<button type="button" class="sched-tag" data-act="open-day" data-date="' + date +
                          '" style="--tag-bg:' + META.type[it.type].bg + ';--tag-dot:' + META.format[it.format].dot +
                          '" title="' + esc(it.type + ' · ' + it.format + ' · ' + it.title) + '">' +
                          '<i class="sched-tag-dot"></i><span class="sched-tag-name">' + esc(it.format + ' ' + it.title) + '</span></button>'
                      )
                      .join('') +
                    '</div></article>'
                  );
                })
                .join('') +
              '</div>'
            : '<div class="card empty-card"><p class="empty-title">这个月还没有排期</p><p class="empty-desc">点右下角 + 添加第一条排期吧</p></div>';

          return (
            '<div class="sched-head-row"><div>' +
            '<h1 class="page-title">排期日历</h1>' +
            '<p class="page-sub">' + formatMonthCN(year, month) + ' · 共' + monthItems.length + '条排期</p>' +
            '</div><button type="button" class="btn-today" data-act="today">今天</button></div>' +

            '<div class="month-nav"><h2>' + formatMonthCN(year, month) + '</h2>' +
            '<div class="month-arrows">' +
            '<button type="button" data-act="prev-month" aria-label="上个月">' + icon('chevronLeft', 20, 2.6) + '</button>' +
            '<button type="button" data-act="next-month" aria-label="下个月">' + icon('chevronRight', 20, 2.6) + '</button>' +
            '</div></div>' +

            '<section class="calendar"><div class="calendar-weekdays">' +
            ['一', '二', '三', '四', '五', '六', '日'].map((w) => '<span>' + w + '</span>').join('') +
            '</div><div class="calendar-grid">' + gridHTML + '</div></section>' +

            legend +

            '<div class="month-list-head"><div><h3>本月排期</h3><span>共' + monthItems.length + '条</span></div>' +
            '<div class="seg-mini schedule-sort" aria-label="本月排期排序">' +
            '<button type="button" data-act="schedule-sort" data-sort="asc" data-active="' + (state.scheduleSort === 'asc') + '">正序</button>' +
            '<button type="button" data-act="schedule-sort" data-sort="desc" data-active="' + (state.scheduleSort === 'desc') + '">倒序</button>' +
            '</div></div>' +
            '<div class="month-hint"><p class="hint">点日期可查看排期、新增或删除；用右下角 + 快速新增。</p></div>' +
            listHTML +

            '<button type="button" class="fab" data-act="fab-add" aria-label="快速新增排期">' + icon('plus', 26, 2.8) + '</button>'
          );
        }

        /* ==========================================================
           页面二：选题规划
           ========================================================== */
        function topicPage() {
          const all = state.topics;
          const counts = { 全部: all.length };
          TOPIC_STATUSES.forEach((s) => {
            counts[s] = all.filter((t) => t.status === s).length;
          });

          const filter = state.topicFilter;
          const visible = filter === '全部' ? all : all.filter((t) => t.status === filter);

          const filterHTML =
            '<div class="filter-scroll">' +

              visible

                    (t.notes ? '<p class="topic-notes">' + esc(t.notes) + '</p>' : '') +

            '</div></div>' +

        /* ==========================================================
           页面三：收支
           ========================================================== */
        function financePage() {
          const sorted = state.finance.slice().sort((a, b) =>
            a.date === b.date ? String(b.createdAt).localeCompare(String(a.createdAt)) : b.date.localeCompare(a.date)
          );
          const monthKeys = [];
          sorted.forEach((it) => {
            const k = String(it.date).slice(0, 7);
            if (/^\d{4}-\d{2}$/.test(k) && monthKeys.indexOf(k) < 0) monthKeys.push(k);
          });
          monthKeys.sort((a, b) => a.localeCompare(b));

          let cursor = state.financeCursor || yearMonth(todayISO());
          const initialKey = cursor.year + '-' + pad2(cursor.month);
          if (monthKeys.length && monthKeys.indexOf(initialKey) < 0) {
            cursor = yearMonth(monthKeys[monthKeys.length - 1] + '-01');
            state.financeCursor = cursor;
          }

          const refISO = cursor.year + '-' + pad2(cursor.month) + '-01';
          const stats = computeStats(state.finance, refISO);
          const filter = state.financeFilter;
          const monthKey = cursor.year + '-' + pad2(cursor.month);
          const monthItems = sorted.filter((i) => String(i.date).slice(0, 7) === monthKey);
          const visible = filter === '全部'
            ? monthItems
            : monthItems.filter((i) => i.type === (filter === '收入' ? 'income' : 'expense'));

          const currentMonthKey = monthKeys.indexOf(monthKey);
          const hasMonths = monthKeys.length > 0;
          const canPrevMonth = hasMonths && currentMonthKey > 0;
          const canNextMonth = hasMonths && currentMonthKey >= 0 && currentMonthKey < monthKeys.length - 1;

          const statCard = (label, value, tone, ic) =>
            '<div class="stat-card" data-tone="' + tone + '">' +
            '<p class="stat-label">' + ic + esc(label) + '</p>' +
            '<p class="stat-value">' + esc(value) + '</p></div>';

          const list = visible.length
            ? '<div class="finance-list">' +
              visible
                .map(
                  (it) =>
                    '<article class="card fin-card">' +
                    '<div class="fin-main">' +
                    '<div class="fin-top">' + chip(META.finance[it.type], it.category) +
                    '<span class="fin-date">' + esc(it.date) + '</span></div>' +
                    (it.description ? '<p class="fin-desc">' + esc(it.description) + '</p>' : '') +
                    '</div>' +
                    '<div class="fin-right">' +
                    '<span class="fin-amount" data-type="' + it.type + '">' + formatSigned(it) + '</span>' +
                    '<div class="fin-actions">' +
                    '<button type="button" class="icon-btn" data-act="edit-finance" data-id="' + it.id + '" aria-label="编辑这笔记录">' + icon('pencil', 16, 2.2) + '</button>' +
                    '<button type="button" class="icon-btn" data-icon-danger="true" data-act="del-finance" data-id="' + it.id + '" aria-label="删除这笔记录">' + icon('trash', 16, 2.2) + '</button>' +
                    '</div></div></article>'
                )
                .join('') +
              '</div>'
            : '<div class="card empty-card">' +
              '<div class="empty-icon">' + icon('walletMini', 30, 2) + '</div>' +
              '<p class="empty-title">' + (filter === '全部' ? formatMonthCN(cursor.year, cursor.month) + '还没有收支记录' : formatMonthCN(cursor.year, cursor.month) + '还没有' + filter + '记录') + '</p>' +
              '<p class="empty-desc">点上方「+ 收入」或「− 支出」记一笔吧</p>' +
              '</div>';

          return (
            '<div class="finance-head"><h1 class="finance-title">收支</h1>' +
            '<div class="seg-mini">' +
            ['全部', '收入', '支出']
              .map((k) => '<button type="button" data-act="fin-filter" data-filter="' + k + '" data-active="' + (filter === k) + '">' + k + '</button>')
              .join('') +
            '</div></div>' +

            '<div class="finance-month-nav">' +
            '<button type="button" class="finance-month-arrow" data-act="finance-prev-month" aria-label="上一个有记录的月份" ' + (canPrevMonth ? '' : 'disabled') + '>' + icon('chevronLeft', 19, 2.6) + '</button>' +
            '<div class="finance-month-current"><strong>' + formatMonthCN(cursor.year, cursor.month) + '</strong><span>' + monthItems.length + ' 笔记录</span></div>' +
            '<button type="button" class="finance-month-arrow" data-act="finance-next-month" aria-label="下一个有记录的月份" ' + (canNextMonth ? '' : 'disabled') + '>' + icon('chevronRight', 19, 2.6) + '</button>' +
            '</div>' +

            '<div class="finance-months">' +
            (monthKeys.length ? monthKeys.map((k) => {
              const ym = yearMonth(k + '-01');
              const label = ym.year + '.' + pad2(ym.month);
              return '<button type="button" class="finance-month-pill" data-act="finance-month" data-year="' + ym.year + '" data-month="' + ym.month + '" data-active="' + (ym.year === cursor.year && ym.month === cursor.month) + '">' + label + '</button>';
            }).join('') : '<span class="finance-month-empty">有记录后会自动生成月份</span>') +
            '</div>' +

            '<div class="stat-grid finance-stat-grid">' +
            statCard('本月收入', formatMoney(stats.monthIncome), 'income', icon('trendUp', 13, 2.6)) +
            statCard('本月支出', formatMoney(stats.monthExpense), 'expense', icon('trendDown', 13, 2.6)) +
            statCard('本月结余', formatMoney(stats.monthBalance), 'balance', icon('walletMini', 13, 2.4)) +
            '</div>' +

            '<div class="finance-list-head"><div><h3>' + formatMonthCN(cursor.year, cursor.month) + '明细</h3><span>' + visible.length + ' 条' + (filter === '全部' ? '' : ' · ' + filter) + '</span></div><div class="finance-add">' +
            '<button type="button" class="finance-add-income" data-act="new-finance" data-kind="income">+ 收入</button>' +
            '<button type="button" class="finance-add-expense" data-act="new-finance" data-kind="expense">− 支出</button>' +
            '</div></div>' +

            '<p class="hint" style="padding:0 2px 14px">这里只显示已有收支记录的月份；新增记录后会自动归入对应月份。</p>' +
            list
          );
        }

        /* ==========================================================
           Bottom Sheet 外壳
           ========================================================== */
        function panelHTML(title, bodyHTML, footHTML) {
          return (
            '<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
            '<div class="sheet-head"><h2 class="sheet-title">' + esc(title) + '</h2>' +
            '<button type="button" class="sheet-close" data-act="close-sheet" aria-label="关闭">' + icon('x', 18, 2.6) + '</button></div>' +
            '<div class="sheet-body">' + bodyHTML + '</div>' +
            (footHTML ? '<div class="sheet-foot">' + footHTML + '</div>' : '') +
            '</div>'
          );
        }

        function renderSheet() {
          const root = sheetRoot();
          const s = state.sheet;
          const isSheetUpdate = !!root.querySelector('.sheet-overlay');
          if (!s) {
            root.innerHTML = '';
            document.body.classList.remove('locked');
            return;
          }
          document.body.classList.add('locked');

          let title = '';
          let body = '';
          let foot = '';

          if (s.kind === 'day') {
            const f = s.form || {};
            title = formatMonthDayCN(s.date) + ' 排期';
            const items = state.schedule
              .filter((i) => i.date === s.date)
              .sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
            body = items.length
              ? '<div class="day-list">' +
                items
                  .map(
                    (it) =>
                      '<div class="day-item">' +
                      '<div class="day-item-head"><h3 class="day-item-title">' + esc(it.title) + '</h3>' +
                      '<div class="day-item-actions">' +
                      '<button type="button" data-act="edit-schedule" data-id="' + it.id + '">编辑</button>' +
                      '<button type="button" data-act="del-schedule" data-id="' + it.id + '" data-from="day">删除</button>' +
                      '</div></div>' +
                      '<div class="day-item-chips">' +
                      chip(META.type[it.type], '类型 · ' + it.type) +
                      chip(META.note[it.noteStatus], '状态 · ' + it.noteStatus) +
                      chip(META.format[it.format], '形式 · ' + it.format) +
                      '</div></div>'
                  )
                  .join('') +
                '</div>'
              : '<div class="day-empty"><p class="day-empty-title">这一天还没有排期</p>' +
                '<p class="day-empty-desc">点下方按钮添加一条吧</p></div>';
            foot =
              '<button type="button" class="btn btn-primary btn-block" data-act="add-schedule" data-date="' + s.date + '">' +
              icon('plus', 18, 2.8) + '添加排期</button>';
          } else if (s.kind === 'schedule') {
            const f = s.form;
            title = f.id ? '编辑排期' : '新增排期';
            body =
              '<div class="field"><label class="field-label" for="f-sch-title">标题</label>' +
              '<input id="f-sch-title" class="input" data-field="title" maxlength="40" placeholder="写什么？（如：香皂）" value="' + esc(f.title) + '"></div>' +

              '<div class="field"><span class="field-label">日期</span><div class="date-row">' +
              '<div class="date-field">' +
              '<span class="date-field-text" data-date-label>' + formatDateCN(f.date) + '</span>' +
              '<input class="date-field-input" type="date" data-field="date" value="' + esc(f.date) + '">' +
              '<button type="button" class="date-field-icon" data-act="open-picker" aria-label="打开日期选择">' + icon('calendar', 17, 2.4) + '</button>' +
              '</div>' +
              '<button type="button" class="btn-today" data-act="set-today">今天</button>' +
              '</div></div>' +

              '<div class="field"><span class="field-label">类型</span>' +
              segPills('type', TYPES, f.type, (o) => META.type[o]) + '</div>' +

              '<div class="field"><span class="field-label">笔记状态</span>' +
              segPills('noteStatus', NOTES, f.noteStatus, (o) => META.note[o]) + '</div>' +

              '<div class="field"><span class="field-label">形式</span>' +
              segPills('format', FORMATS, f.format, (o) => META.format[o]) + '</div>' +

              '<div class="field"><span class="field-label">色块预览</span><div class="swatch-row">' +
              TYPES.map(
                (t) =>
                  '<button type="button" class="swatch" data-act="pick" data-field="type" data-value="' + t +
                  '" data-active="' + (f.type === t) + '" style="background:' + META.type[t].bg + ';color:' + META.type[t].text + '">色块 · ' + t + '</button>'
              ).join('') +
              '</div></div>' +

              '<p class="form-error" data-show="' + !!f.error + '">' + esc(f.error || '') + '</p>';

            foot =
              (f.id ? '<button type="button" class="btn btn-danger" data-act="del-schedule" data-id="' + f.id + '" data-from="form" data-armed="false" data-label="删除">删除</button>' : '') +
              '<button type="button" class="btn btn-primary btn-block" data-act="save-schedule">保存排期</button>';
          } else if (s.kind === 'topic') {
            const f = s.form;
            title = f.id ? '编辑选题' : '新增选题';
            body =
              '<div class="field"><label class="field-label" for="f-topic-title">选题标题</label>' +
              '<input id="f-topic-title" class="input" data-field="title" maxlength="60" placeholder="想写什么？" value="' + esc(f.title) + '"></div>' +

              '<div class="field"><span class="field-label">平台</span>' +
              segPills('platform', TOPIC_PLATFORMS, f.platform, () => META.type['广告'], null, true) + '</div>' +

              '<div class="field"><span class="field-label">状态</span>' +
              segPills('status', TOPIC_STATUSES, f.status, (o) => META.topic[o]) + '</div>' +

              '<div class="field"><label class="field-label" for="f-topic-notes">备注</label>' +
              '<textarea id="f-topic-notes" class="textarea" data-field="notes" placeholder="选题思路、参考链接、素材…">' + esc(f.notes) + '</textarea></div>' +

              '<p class="form-error" data-show="' + !!f.error + '">' + esc(f.error || '') + '</p>';

            foot =
              (f.id ? '<button type="button" class="btn btn-danger" data-act="del-topic" data-id="' + f.id + '" data-from="form" data-armed="false" data-label="删除">删除</button>' : '') +
              '<button type="button" class="btn btn-primary btn-block" data-act="save-topic">保存选题</button>';
          } else if (s.kind === 'finance') {
            const f = s.form;
            const cats = FIN_CATEGORIES[f.type];
            title = f.id ? '编辑记录' : '新增' + FIN_LABEL[f.type];
            body =
              '<div class="field"><span class="field-label">类型</span>' +
              segPills('type', ['income', 'expense'], f.type, (o) => META.finance[o], (o) => FIN_LABEL[o]) + '</div>' +

              '<div class="field"><span class="field-label">分类</span>' +
              segPills('category', cats, cats.indexOf(f.category) >= 0 ? f.category : cats[0], () => META.finance[f.type], null, true) + '</div>' +

              '<div class="field"><label class="field-label" for="f-fin-amount">金额</label>' +
              '<input id="f-fin-amount" class="input" data-field="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="' + esc(f.amount) + '"></div>' +

              '<div class="field"><span class="field-label">日期</span><div class="date-row">' +
              '<div class="date-field">' +
              '<span class="date-field-text" data-date-label>' + formatDateCN(f.date) + '</span>' +
              '<input class="date-field-input" type="date" data-field="date" value="' + esc(f.date) + '">' +
              '<button type="button" class="date-field-icon" data-act="open-picker" aria-label="打开日期选择">' + icon('calendar', 17, 2.4) + '</button>' +
              '</div>' +
              '<button type="button" class="btn-today" data-act="set-today">今天</button>' +
              '</div></div>' +

              '<div class="field"><label class="field-label" for="f-fin-desc">备注</label>' +
              '<textarea id="f-fin-desc" class="textarea" data-field="description" placeholder="例如：薯条 212平台扣21块2">' + esc(f.description) + '</textarea></div>' +

              '<p class="form-error" data-show="' + !!f.error + '">' + esc(f.error || '') + '</p>';

            foot =
              (f.id ? '<button type="button" class="btn btn-danger" data-act="del-finance" data-id="' + f.id + '" data-from="form" data-armed="false" data-label="删除">删除</button>' : '') +
              '<button type="button" class="btn btn-primary btn-block" data-act="save-finance">保存记录</button>';
          }

          root.innerHTML =
            '<div class="sheet-overlay" data-act="backdrop" data-state="open" data-static="' + isSheetUpdate + '">' + panelHTML(title, body, foot) + '</div>';
        }

        /* ==========================================================
           打开 / 关闭
           ========================================================== */
        function closeSheet() {
          const ov = document.querySelector('.sheet-overlay');
          const target = state.sheet;
          const finish = () => {
            if (state.sheet === target) {
              state.sheet = null;
              renderSheet();
            }
          };
          if (ov) {
            ov.dataset.state = 'closing';
            window.setTimeout(finish, 190);
          } else {
            finish();
          }
        }

        function openDay(date) {
          state.selectedDate = date;
          state.sheet = { kind: 'day', date };
          render();
        }

        function openScheduleForm(date, item) {
          state.selectedDate = date;
          state.sheet = {
            kind: 'schedule',
            returnToDay: !!item,
            form: item
              ? { id: item.id, title: item.title, date: item.date, type: item.type, noteStatus: item.noteStatus, format: item.format, error: '' }
              : { id: null, title: '', date: date, type: '广告', noteStatus: '无', format: '单推', error: '' }
          };
          render();
        }

        function openTopicForm(item) {
          state.sheet = {
            kind: 'topic',
            form: item
              ? { id: item.id, title: item.title, platform: item.platform, status: item.status, notes: item.notes, error: '' }
              : { id: null, title: '', platform: TOPIC_PLATFORMS[0], status: '灵感', notes: '', error: '' }
          };
          render();
        }

        function openFinanceForm(type, item) {
          const cursor = state.financeCursor || yearMonth(todayISO());
          const cursorMonth = cursor.year + '-' + pad2(cursor.month);
          const today = todayISO();
          const defaultDate = today.slice(0, 7) === cursorMonth ? today : cursorMonth + '-01';
          state.sheet = {
            kind: 'finance',
            form: item
              ? { id: item.id, type: item.type, category: item.category, date: item.date, amount: String(item.amount), description: item.description, error: '' }
              : { id: null, type: type, category: FIN_CATEGORIES[type][0], date: defaultDate, amount: '', description: '', error: '' }
          };
          render();
        }

        /* ==========================================================
           保存 / 删除
           ========================================================== */
        function saveSchedule() {
          const f = state.sheet.form;
          const title = String(f.title || '').trim();
          if (!title) { f.error = '请先填写标题'; renderSheet(); return; }
          if (!isValidISO(f.date)) { f.error = '请选择日期'; renderSheet(); return; }

          const stamp = nowStamp();
          if (f.id) {
            state.schedule = state.schedule.map((i) =>
              i.id === f.id
                ? { id: i.id, title: title, date: f.date, type: f.type, noteStatus: f.noteStatus, format: f.format, createdAt: i.createdAt, updatedAt: stamp }
                : i
            );
          } else {
            state.schedule = state.schedule.concat([
              { id: uid('sch'), title: title, date: f.date, type: f.type, noteStatus: f.noteStatus, format: f.format, createdAt: stamp, updatedAt: stamp }
            ]);
          }
          save(KEYS.schedule, state.schedule);
          state.cursor = yearMonth(f.date);
          state.selectedDate = f.date;
          state.sheet = f.id && state.sheet.returnToDay ? { kind: 'day', date: f.date } : null;
          render();
        }

        function deleteSchedule(id, from) {
          const item = state.schedule.filter((i) => i.id === id)[0];
          state.schedule = state.schedule.filter((i) => i.id !== id);
          save(KEYS.schedule, state.schedule);
          if (from === 'form') state.sheet = item ? { kind: 'day', date: item.date } : null;
          render();
        }

        function saveTopic() {
          const f = state.sheet.form;
          const title = String(f.title || '').trim();
          if (!title) { f.error = '请先填写选题标题'; renderSheet(); return; }

          const stamp = nowStamp();
          if (f.id) {
            state.topics = state.topics.map((t) =>
              t.id === f.id
                ? { id: t.id, title: title, platform: f.platform, status: f.status, notes: String(f.notes || '').trim(), createdAt: t.createdAt, updatedAt: stamp }
                : t
            );
          } else {
            state.topics = [{ id: uid('top'), title: title, platform: f.platform, status: f.status, notes: String(f.notes || '').trim(), createdAt: stamp, updatedAt: stamp }].concat(state.topics);
          }
          save(KEYS.topic, state.topics);
          state.sheet = null;
          render();
        }

        function deleteTopic(id) {
          state.topics = state.topics.filter((t) => t.id !== id);
          save(KEYS.topic, state.topics);
          if (state.sheet && state.sheet.kind === 'topic') state.sheet = null;
          render();
        }

        function saveFinance() {
          const f = state.sheet.form;
          const amount = Number(f.amount);
          if (!isFinite(amount) || amount <= 0) { f.error = '请填写大于 0 的金额'; renderSheet(); return; }
          if (!isValidISO(f.date)) { f.error = '请选择日期'; renderSheet(); return; }

          const stamp = nowStamp();
          const payload = {
            type: f.type, category: f.category, date: f.date,
            amount: Math.round(amount * 100) / 100,
            description: String(f.description || '').trim()
          };
          if (f.id) {
            state.finance = state.finance.map((i) => (i.id === f.id ? Object.assign({}, i, payload, { updatedAt: stamp }) : i));
          } else {
            state.finance = state.finance.concat([Object.assign({ id: uid('fin'), createdAt: stamp, updatedAt: stamp }, payload)]);
          }
          save(KEYS.finance, state.finance);
          state.financeCursor = yearMonth(f.date);
          state.sheet = null;
          render();
        }

        function deleteFinance(id) {
          state.finance = state.finance.filter((i) => i.id !== id);
          save(KEYS.finance, state.finance);
          if (state.sheet && state.sheet.kind === 'finance') state.sheet = null;
          render();
        }

        /* 两段式确认删除（图标按钮 / 文字按钮通用） */
        function armOrRun(btn) {
          if (btn.dataset.armed === 'true') return true;
          btn.dataset.armed = 'true';
          if (btn.classList.contains('icon-btn')) {
            btn.classList.add('armed');
          } else {
            btn.textContent = '确认删除？';
          }
          window.setTimeout(() => {
            if (!btn.isConnected) return;
            btn.dataset.armed = 'false';
            btn.classList.remove('armed');
            if (!btn.classList.contains('icon-btn')) btn.textContent = btn.dataset.label || '删除';
          }, 2600);
          return false;
        }

        /* ==========================================================
           事件
           ========================================================== */
        document.addEventListener('click', function (e) {
          const btn = e.target.closest ? e.target.closest('[data-act]') : null;
          if (!btn) return;
          const act = btn.dataset.act;
          const s = state.sheet;

          switch (act) {
            case 'tab':
              state.tab = btn.dataset.tab;
              try { window.localStorage.setItem(KEYS.tab, state.tab); } catch (err) {}
              window.scrollTo(0, 0);
              render();
              break;

            case 'today':
              state.cursor = yearMonth(todayISO());
              state.selectedDate = todayISO();
              render();
              break;

            case 'prev-month':
              state.cursor = addMonths(state.cursor.year, state.cursor.month, -1);
              render();
              break;

            case 'next-month':
              state.cursor = addMonths(state.cursor.year, state.cursor.month, 1);
              render();
              break;

            case 'schedule-sort':
              state.scheduleSort = btn.dataset.sort === 'desc' ? 'desc' : 'asc';
              render();
              break;

            case 'open-day':
              openDay(btn.dataset.date);
              break;

            case 'new-schedule-date':
              openScheduleForm(btn.dataset.date, null);
              break;

            case 'fab-add':
              openScheduleForm(state.selectedDate || todayISO(), null);
              break;

            case 'add-schedule':
              openScheduleForm(btn.dataset.date, null);
              break;

            case 'edit-schedule':
              var sch = state.schedule.filter((i) => i.id === btn.dataset.id)[0];
              if (sch) openScheduleForm(sch.date, sch);
              break;

            case 'save-schedule':
              saveSchedule();
              break;

            case 'del-schedule':
              if (btn.dataset.from === 'day' || armOrRun(btn)) deleteSchedule(btn.dataset.id, btn.dataset.from);
              break;

            case 'new-topic':
              openTopicForm(null);
              break;

            case 'edit-topic':
              var tp = state.topics.filter((t) => t.id === btn.dataset.id)[0];
              if (tp) openTopicForm(tp);
              break;

            case 'del-topic':
              if (armOrRun(btn)) deleteTopic(btn.dataset.id);
              break;

            case 'save-topic':
              saveTopic();
              break;

            case 'topic-filter':
              state.topicFilter = btn.dataset.filter;
              render();
              break;

            case 'new-finance':
              openFinanceForm(btn.dataset.kind, null);
              break;

            case 'edit-finance':
              var fin = state.finance.filter((i) => i.id === btn.dataset.id)[0];
              if (fin) openFinanceForm(fin.type, fin);
              break;

            case 'del-finance':
              if (armOrRun(btn)) deleteFinance(btn.dataset.id);
              break;

            case 'save-finance':
              saveFinance();
              break;

            case 'fin-filter':
              state.financeFilter = btn.dataset.filter;
              render();
              break;

            case 'finance-prev-month': {
              const keys = Array.from(new Set(state.finance.map((i) => String(i.date).slice(0, 7))))
                .filter((k) => /^\d{4}-\d{2}$/.test(k))
                .sort((a, b) => a.localeCompare(b));
              const cur = (state.financeCursor.year + '-' + pad2(state.financeCursor.month));
              const idx = keys.indexOf(cur);
              if (idx > 0) state.financeCursor = yearMonth(keys[idx - 1] + '-01');
              render();
              break;
            }

            case 'finance-next-month': {
              const keys = Array.from(new Set(state.finance.map((i) => String(i.date).slice(0, 7))))
                .filter((k) => /^\d{4}-\d{2}$/.test(k))
                .sort((a, b) => a.localeCompare(b));
              const cur = (state.financeCursor.year + '-' + pad2(state.financeCursor.month));
              const idx = keys.indexOf(cur);
              if (idx >= 0 && idx < keys.length - 1) state.financeCursor = yearMonth(keys[idx + 1] + '-01');
              render();
              break;
            }

            case 'finance-month':
              state.financeCursor = { year: Number(btn.dataset.year), month: Number(btn.dataset.month) };
              render();
              break;

            case 'pick': {
              if (!s || !s.form) break;
              const field = btn.dataset.field;
              const value = btn.dataset.value;
              s.form[field] = value;
              if (s.kind === 'finance' && field === 'type') {
                const cats = FIN_CATEGORIES[value];
                if (cats.indexOf(s.form.category) < 0) s.form.category = cats[0];
              }
              if (s.form.error) s.form.error = '';
              renderSheet();
              break;
            }

            case 'set-today':
              if (!s || !s.form) break;
              s.form.date = todayISO();
              renderSheet();
              break;

            case 'open-picker': {
              const input = document.querySelector('.date-field-input');
              if (input) {
                if (typeof input.showPicker === 'function') {
                  try { input.showPicker(); break; } catch (err) {}
                }
                input.focus();
              }
              break;
            }

            case 'close-sheet':
              closeSheet();
              break;

            case 'backdrop':
              if (e.target === btn) closeSheet();
              break;

            default:
              break;
          }
        });

        function onFieldInput(e) {
          const el = e.target.closest ? e.target.closest('[data-field]') : null;
          if (!el || !el.dataset || el.tagName === 'BUTTON') return;
          const s = state.sheet;
          if (!s || !s.form) return;
          const field = el.dataset.field;
          if (field === 'type' || field === 'noteStatus' || field === 'format' || field === 'status' || field === 'category' || field === 'platform') return;

          s.form[field] = el.value;
          if (field === 'date') {
            const label = document.querySelector('[data-date-label]');
            if (label) label.textContent = formatDateCN(el.value);
          }
          if (s.form.error) {
            s.form.error = '';
            const err = document.querySelector('.form-error');
            if (err) { err.dataset.show = 'false'; err.textContent = ''; }
          }
        }
        document.addEventListener('input', onFieldInput);
        document.addEventListener('change', onFieldInput);

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && state.sheet) closeSheet();
        });

        /* ==========================================================
           启动
           ========================================================== */
        if ('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual';
        hydrateIcons();
        render();
        window.scrollTo(0, 0);

        /* ---------------- 渲染 ---------------- */
        function hydrateIcons(root) {
          (root || document).querySelectorAll('[data-icon]').forEach((el) => {
            if (el.dataset.done === '1') return;
            el.innerHTML = icon(el.dataset.icon, Number(el.dataset.size || 18), Number(el.dataset.sw || 2));
            el.dataset.done = '1';
          });
        }

        function render() {
          shellEl().dataset.tone = state.tab === 'finance' ? 'finance' : 'default';
          mainEl().innerHTML =
            state.tab === 'schedule' ? schedulePage() : state.tab === 'topic' ? topicPage() : financePage();

          document.querySelectorAll('#nav .nav-item').forEach((b) => {
            b.dataset.active = String(b.dataset.tab === state.tab);
          });
          hydrateIcons();
          renderSheet();
        }
      })();

    </script>
  </body>
</html>
